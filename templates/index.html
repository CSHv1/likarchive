<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Likarchive</title>
  <script>window.__CLERK_PUBLISHABLE_KEY = "{{ clerk_publishable_key }}";</script>
  <style>
    :root {
      --bg:            #F6F8FB;
      --surface:       #FFFFFF;
      --surface-2:     #F1F5F9;
      --border:        #DCE6F0;
      --divider:       #E7EEF5;
      --text-1:        #162230;
      --text-2:        #5F6E7D;
      --text-muted:    #8895A3;
      --blue:          #0A66C2;
      --blue-dark:     #004182;
      --blue-tint:     #EAF4FF;
      --blue-hover:    #DCEEFF;
      --blue-sel:      #D7E9FF;
      --radius-card:   14px;
      --radius-pill:   999px;
      --sidebar-w:     248px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text-1);
      height: 100vh;
      display: flex;
      overflow: hidden;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Sidebar ─────────────────────────────────────────────── */
    #sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .sb-header {
      padding: 20px 18px 14px;
      border-bottom: 1px solid var(--divider);
      flex-shrink: 0;
    }

    .sb-logo {
      font-size: 16px;
      font-weight: 700;
      color: var(--blue);
      letter-spacing: -0.3px;
    }

    .sb-tagline {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .sb-nav {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 16px;
    }

    .sb-nav-item {
      display: flex;
      align-items: center;
      padding: 8px 18px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-2);
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
      user-select: none;
      gap: 8px;
    }

    .sb-nav-item:hover  { background: var(--blue-tint); color: var(--blue); }
    .sb-nav-item.active { background: var(--blue-sel);  color: var(--blue); font-weight: 600; }

    .sb-nav-item.disabled {
      color: var(--text-muted);
      cursor: default;
      opacity: 0.45;
    }
    .sb-nav-item.disabled:hover { background: none; color: var(--text-muted); }

    .sb-count { margin-left: auto; font-size: 11.5px; color: var(--text-muted); font-weight: 400; }

    .sb-section { border-top: 1px solid var(--divider); padding-top: 10px; margin-top: 4px; }

    .sb-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 3px 18px 7px;
      cursor: pointer;
      user-select: none;
    }

    .sb-section-label {
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--text-muted);
    }

    .sb-section-chevron { font-size: 10px; color: var(--text-muted); }

    .sb-filter-list {
      padding: 0 10px 6px;
      max-height: 220px;
      overflow-y: auto;
    }

    .sb-filter-item {
      display: flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12.5px;
      color: var(--text-2);
      cursor: pointer;
      transition: background 0.1s;
      gap: 6px;
    }

    .sb-filter-item:hover    { background: var(--blue-tint); color: var(--blue); }
    .sb-filter-item.selected { background: var(--blue-sel);  color: var(--blue); font-weight: 500; }

    .sb-filter-item span:last-child { margin-left: auto; font-size: 11px; color: var(--text-muted); }

    /* ── Main ────────────────────────────────────────────────── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    /* Top bar */
    #topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    #search {
      flex: 1;
      padding: 9px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 13.5px;
      color: var(--text-1);
      background: var(--surface);
      outline: none;
      transition: border-color 0.15s;
    }
    #search::placeholder { color: var(--text-muted); }
    #search:focus { border-color: var(--blue); }

    #result-count {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      min-width: 72px;
      text-align: right;
    }

    /* Filter chips */
    #chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--divider);
      flex-shrink: 0;
    }
    #chips:empty { display: none; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      background: var(--blue-tint);
      color: var(--blue);
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    .chip .x { opacity: 0.55; font-size: 13px; line-height: 1; }
    .chip:hover .x { opacity: 1; }
    .chip.clear { background: var(--surface-2); color: var(--text-2); }

    /* Content */
    #content {
      flex: 1;
      overflow-y: auto;
      padding: 18px 24px 24px;
    }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 16px 18px 14px;
      margin-bottom: 9px;
      transition: box-shadow 0.15s;
    }
    .card:hover { box-shadow: 0 2px 10px rgba(10,102,194,0.08); }

    .card-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 7px;
    }

    .card-author {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-1);
    }

    .card-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .card-ts {
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .card-link {
      font-size: 12px;
      color: var(--blue);
      text-decoration: none;
      font-weight: 500;
      white-space: nowrap;
    }
    .card-link:hover { color: var(--blue-dark); text-decoration: underline; }

    .card-body {
      font-size: 13px;
      line-height: 1.58;
      color: var(--text-2);
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .card-body.clamped {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      white-space: normal;
    }

    .card-toggle {
      font-size: 12px;
      color: var(--blue);
      cursor: pointer;
      font-weight: 500;
      margin-bottom: 10px;
      display: inline-block;
    }
    .card-toggle:hover { color: var(--blue-dark); }

    .card-tags { display: flex; flex-wrap: wrap; gap: 4px; }

    .tag {
      display: inline-block;
      padding: 2px 9px;
      background: var(--blue-tint);
      color: var(--blue);
      border-radius: var(--radius-pill);
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.1s;
    }
    .tag:hover  { background: var(--blue-hover); }
    .tag.active { background: var(--blue); color: #fff; }

    /* Load more */
    #load-more { text-align: center; padding: 14px 0 4px; }

    #load-more-btn {
      padding: 8px 22px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-2);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    #load-more-btn:hover { border-color: var(--blue); color: var(--blue); }

    /* Date picker */
    .date-picker { padding: 2px 12px 10px; }

    .date-row {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 7px;
    }

    .date-lbl {
      font-size: 11.5px;
      color: var(--text-muted);
      width: 28px;
      flex-shrink: 0;
    }

    .date-sel {
      flex: 1;
      min-width: 0;
      font-size: 12px;
      padding: 4px 5px;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      color: var(--text-1);
      background: var(--surface);
      outline: none;
      cursor: pointer;
      appearance: auto;
    }
    .date-sel:focus { border-color: var(--blue); }

    .date-clear-link {
      font-size: 11.5px;
      color: var(--blue);
      cursor: pointer;
      font-weight: 500;
    }
    .date-clear-link:hover { color: var(--blue-dark); text-decoration: underline; }

    /* States */
    .empty {
      text-align: center;
      padding: 56px 24px;
      color: var(--text-muted);
    }
    .empty strong {
      display: block;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 5px;
    }

    .spinner {
      text-align: center;
      padding: 48px;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* Sync status banner */
    #sync-banner {
      display: none;
      padding: 10px 24px;
      font-size: 12.5px;
      line-height: 1.5;
      border-bottom: 1px solid var(--divider);
      flex-shrink: 0;
    }
    #sync-banner.error {
      display: block;
      background: #FDECEC;
      color: #8A1F1F;
      border-bottom-color: #F5C6C6;
    }
    #sync-banner strong { font-weight: 700; }
    #sync-banner code {
      background: rgba(0,0,0,0.06);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 11.5px;
    }

    /* Clerk auth gate */
    #auth-gate {
      display: none;
      width: 100vw;
      height: 100vh;
      align-items: center;
      justify-content: center;
      background: var(--bg);
    }
    #auth-gate.visible { display: flex; }
    #app-shell { display: contents; }
    #app-shell.hidden { display: none; }

    #user-button { flex-shrink: 0; }
  </style>
</head>
<body>

<!-- ── Clerk auth gate ─────────────────────────────────────────────────── -->
<div id="auth-gate"><div id="sign-in"></div></div>

<div id="app-shell" class="hidden">

<!-- ── Sidebar ─────────────────────────────────────────────────────────── -->
<aside id="sidebar">
  <div class="sb-header">
    <div class="sb-logo">Likarchive</div>
    <div class="sb-tagline">Your LinkedIn knowledge library</div>
    <div id="user-button"></div>
  </div>

  <nav class="sb-nav">
    <div class="sb-nav-item active" id="nav-all">
      All Saved
      <span class="sb-count" id="nav-total">—</span>
    </div>

    <div class="sb-section">
      <div class="sb-section-head" data-target="tags-list">
        <span class="sb-section-label">Tags</span>
        <span class="sb-section-chevron" id="tags-chev">▾</span>
      </div>
      <div class="sb-filter-list" id="tags-list"></div>
    </div>

    <div class="sb-section">
      <div class="sb-section-head" data-target="authors-list">
        <span class="sb-section-label">Authors</span>
        <span class="sb-section-chevron" id="authors-chev">▾</span>
      </div>
      <div class="sb-filter-list" id="authors-list"></div>
    </div>

    <div class="sb-section">
      <div class="sb-section-head" data-target="time-list">
        <span class="sb-section-label">Date range</span>
        <span class="sb-section-chevron" id="time-chev">▾</span>
      </div>
      <div id="time-list" class="date-picker">
        <div class="date-row">
          <span class="date-lbl">From</span>
          <input type="date" id="from-date" class="date-sel">
        </div>
        <div class="date-row">
          <span class="date-lbl">To</span>
          <input type="date" id="to-date" class="date-sel">
        </div>
        <div id="date-clear-row" style="display:none">
          <span id="date-clear-btn" class="date-clear-link">Clear dates</span>
        </div>
      </div>
    </div>

    <div class="sb-section">
      <div class="sb-nav-item disabled">Export</div>
      <div class="sb-nav-item disabled">Settings</div>
    </div>
  </nav>
</aside>

<!-- ── Main ───────────────────────────────────────────────────────────── -->
<main id="main">
  <div id="sync-banner"></div>
  <div id="topbar">
    <input id="search" type="search" autocomplete="off"
           placeholder="Search posts, authors, keywords and tags…">
    <div id="result-count"></div>
  </div>

  <div id="chips"></div>

  <div id="content"><div class="spinner">Loading…</div></div>
</main>

</div><!-- /#app-shell -->

<script>
// ── State ────────────────────────────────────────────────────────────────
const S = {
  q: '', tags: [], author: '',
  fromDate: '', toDate: '',
  page: 1, pages: 1, loading: false
};

const MONTHS = [
  ['01','Jan'],['02','Feb'],['03','Mar'],['04','Apr'],
  ['05','May'],['06','Jun'],['07','Jul'],['08','Aug'],
  ['09','Sep'],['10','Oct'],['11','Nov'],['12','Dec']
];

// ── Clerk auth gate ──────────────────────────────────────────────────────
function loadScript(src, dataAttrs = {}) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.defer = true;
    s.crossOrigin = 'anonymous';
    for (const [k, v] of Object.entries(dataAttrs)) s.setAttribute(k, v);
    s.onload = resolve;
    s.onerror = () => reject(new Error(`Failed to load ${src}`));
    document.head.appendChild(s);
  });
}

function clerkFapiUrl(pk) {
  const b64 = pk.replace(/^pk_(test|live)_/, '');
  return atob(b64).replace(/\$$/, '');
}

async function authFetch(url, opts = {}) {
  const token = window.Clerk?.session ? await window.Clerk.session.getToken() : null;
  const headers = Object.assign({}, opts.headers, token ? { Authorization: `Bearer ${token}` } : {});
  return fetch(url, Object.assign({}, opts, { headers }));
}

async function initClerkAuth() {
  const pk = window.__CLERK_PUBLISHABLE_KEY;
  if (!pk) {
    document.getElementById('sign-in').innerHTML =
      '<div class="empty"><strong>Clerk is not configured</strong>Set CLERK_PUBLISHABLE_KEY.</div>';
    document.getElementById('auth-gate').classList.add('visible');
    return;
  }
  const fapi = clerkFapiUrl(pk);
  await loadScript(`https://${fapi}/npm/@clerk/ui@1/dist/ui.browser.js`);
  await loadScript(
    `https://${fapi}/npm/@clerk/clerk-js@6/dist/clerk.browser.js`,
    { 'data-clerk-publishable-key': pk },
  );

  await window.Clerk.load({ ui: { ClerkUI: window.__internal_ClerkUICtor } });

  const showApp = () => {
    document.getElementById('auth-gate').classList.remove('visible');
    document.getElementById('app-shell').classList.remove('hidden');
    const ub = document.getElementById('user-button');
    if (!ub.childElementCount) window.Clerk.mountUserButton(ub);
    initApp();
  };

  const showSignIn = () => {
    document.getElementById('app-shell').classList.add('hidden');
    const gate = document.getElementById('auth-gate');
    gate.classList.add('visible');
    const signInDiv = document.getElementById('sign-in');
    if (!signInDiv.childElementCount) window.Clerk.mountSignIn(signInDiv);
  };

  if (window.Clerk.isSignedIn) showApp(); else showSignIn();

  window.Clerk.addListener(({ user }) => {
    if (user && document.getElementById('app-shell').classList.contains('hidden')) {
      location.reload();
    }
  });
}

// ── Init ─────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', initClerkAuth);

let appInitialized = false;
function initApp() {
  if (appInitialized) return;
  appInitialized = true;

  loadSidebar();
  initDatePickers();
  fetchPosts();
  checkSyncStatus();

  // Search with debounce
  let timer;
  document.getElementById('search').addEventListener('input', e => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      S.q = e.target.value.trim();
      reset();
    }, 300);
  });

  // Sidebar section toggle
  document.querySelectorAll('.sb-section-head').forEach(head => {
    head.addEventListener('click', () => {
      const target = head.dataset.target;
      const list   = document.getElementById(target);
      const chev   = head.querySelector('.sb-section-chevron');
      const open   = list.style.display !== 'none';
      list.style.display = open ? 'none' : '';
      chev.textContent = open ? '▸' : '▾';
    });
  });

  // "All Saved" nav item
  document.getElementById('nav-all').addEventListener('click', clearAll);

  // Event delegation — cards
  document.getElementById('content').addEventListener('click', e => {
    const toggle = e.target.closest('.card-toggle, .card-body');
    if (toggle) {
      const card = toggle.closest('.card');
      if (card) expandCard(card);
      return;
    }
    const tag = e.target.closest('.tag');
    if (tag) { toggleTag(tag.dataset.v); return; }

    const lm = e.target.closest('#load-more-btn');
    if (lm) loadMore();
  });

  // Event delegation — sidebar
  document.getElementById('tags-list').addEventListener('click', e => {
    const item = e.target.closest('.sb-filter-item');
    if (item) toggleTag(item.dataset.v);
  });
  document.getElementById('authors-list').addEventListener('click', e => {
    const item = e.target.closest('.sb-filter-item');
    if (item) toggleAuthor(item.dataset.v);
  });
  document.getElementById('date-clear-btn').addEventListener('click', clearDate);

  // Filter chips
  document.getElementById('chips').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    if (chip.classList.contains('clear')) { clearAll(); return; }
    const type = chip.dataset.type;
    if (type === 'tag')    toggleTag(chip.dataset.v);
    if (type === 'author') toggleAuthor(chip.dataset.v);
    if (type === 'date')   clearDate();
  });
}

// ── Sync status ──────────────────────────────────────────────────────────
async function checkSyncStatus() {
  const banner = document.getElementById('sync-banner');
  try {
    const s = await authFetch('/api/sync_status').then(r => r.json());
    if (s.status !== 'error') { banner.className = ''; return; }

    const when = s.finished_at ? new Date(s.finished_at).toLocaleString() : 'unknown time';
    banner.className = 'error';
    banner.innerHTML =
      `<strong>Last sync failed (${esc(when)}).</strong> ${esc(s.error || 'Unknown error.')} ` +
      `Run <code>python save_session.py</code> to log in again and refresh <code>auth_state.json</code>.`;
  } catch {
    banner.className = '';
  }
}

// ── Data ─────────────────────────────────────────────────────────────────
async function loadSidebar() {
  const [tags, authors] = await Promise.all([
    authFetch('/api/tags').then(r => r.json()),
    authFetch('/api/authors').then(r => r.json()),
  ]);
  renderTagList(tags);
  renderAuthorList(authors);
}

async function fetchPosts(append = false) {
  if (S.loading) return;
  S.loading = true;
  if (!append) document.getElementById('content').innerHTML = '<div class="spinner">Loading…</div>';

  const p = new URLSearchParams({ page: S.page });
  if (S.q)      p.set('q', S.q);
  if (S.author) p.set('author', S.author);
  if (S.fromDate) p.set('date_from', S.fromDate);
  if (S.toDate)   p.set('date_to', S.toDate);
  S.tags.forEach(t => p.append('tags', t));

  try {
    const data = await authFetch('/api/posts?' + p).then(r => r.json());
    S.pages = data.pages || 1;

    const countEl = document.getElementById('result-count');
    const navEl   = document.getElementById('nav-total');
    countEl.textContent = data.total === 0 ? 'No results'
      : data.total === 1 ? '1 post' : `${data.total} posts`;
    navEl.textContent = data.total;

    if (append) appendCards(data.posts);
    else        renderCards(data.posts);
  } finally {
    S.loading = false;
  }
}

function reset() { S.page = 1; fetchPosts(false); renderChips(); }

function loadMore() {
  if (S.page >= S.pages) return;
  S.page++;
  fetchPosts(true);
}

// ── Render ────────────────────────────────────────────────────────────────
function renderCards(posts) {
  const el = document.getElementById('content');
  if (!posts.length) {
    el.innerHTML = `<div class="empty"><strong>No posts found</strong>Try adjusting your search or filters.</div>`;
    return;
  }
  el.innerHTML = posts.map(cardHtml).join('') + loadMoreHtml();
  syncLoadMore();
}

function appendCards(posts) {
  const el  = document.getElementById('content');
  const lm  = document.getElementById('load-more');
  if (lm) lm.remove();
  el.insertAdjacentHTML('beforeend', posts.map(cardHtml).join('') + loadMoreHtml());
  syncLoadMore();
}

function cardHtml(post) {
  const tagsHtml = post.tags.map(t => {
    const active = S.tags.includes(t) ? ' active' : '';
    return `<span class="tag${active}" data-v="${esc(t)}">${esc(t)}</span>`;
  }).join('');

  return `<div class="card">
    <div class="card-head">
      <span class="card-author">${esc(post.author_name || '(unknown)')}</span>
      <span class="card-right">
        ${post.post_date ? `<span class="card-ts">${esc(post.post_date)}</span>` : ''}
        <a class="card-link" href="${esc(post.post_url)}" target="_blank" rel="noopener noreferrer">Open →</a>
      </span>
    </div>
    <div class="card-body clamped">${esc(post.post_text)}</div>
    <span class="card-toggle">Show more</span>
    <div class="card-tags">${tagsHtml}</div>
  </div>`;
}

function loadMoreHtml() {
  return `<div id="load-more"><button id="load-more-btn">Load more</button></div>`;
}

function syncLoadMore() {
  const lm = document.getElementById('load-more');
  if (lm && S.page >= S.pages) lm.remove();
}

function renderTagList(tags) {
  document.getElementById('tags-list').innerHTML = tags.slice(0, 60).map(t =>
    `<div class="sb-filter-item${S.tags.includes(t.name) ? ' selected' : ''}" data-v="${esc(t.name)}">
      <span>${esc(t.name)}</span><span>${t.count}</span>
    </div>`
  ).join('');
}

function renderAuthorList(authors) {
  document.getElementById('authors-list').innerHTML = authors.map(a =>
    `<div class="sb-filter-item${S.author === a.name ? ' selected' : ''}" data-v="${esc(a.name)}">
      <span>${esc(a.name)}</span><span>${a.count}</span>
    </div>`
  ).join('');
}

function renderChips() {
  const el = document.getElementById('chips');
  let html = S.tags.map(t =>
    `<span class="chip" data-type="tag" data-v="${esc(t)}">${esc(t)} <span class="x">×</span></span>`
  ).join('');
  if (S.author) {
    html += `<span class="chip" data-type="author" data-v="${esc(S.author)}">${esc(S.author)} <span class="x">×</span></span>`;
  }
  if (S.fromDate || S.toDate) {
    const fmt = ymd => { const [y,m,d] = ymd.split('-'); return `${+d} ${MONTHS[+m-1][1]} ${y}`; };
    const dateLabel = S.fromDate && S.toDate ? `${fmt(S.fromDate)} → ${fmt(S.toDate)}`
      : S.fromDate ? `From ${fmt(S.fromDate)}` : `Until ${fmt(S.toDate)}`;
    html += `<span class="chip" data-type="date">${esc(dateLabel)} <span class="x">×</span></span>`;
  }
  if (html) html += `<span class="chip clear">Clear all</span>`;
  el.innerHTML = html;
}

// ── Interactions ──────────────────────────────────────────────────────────
function toggleTag(name) {
  const i = S.tags.indexOf(name);
  if (i === -1) S.tags.push(name); else S.tags.splice(i, 1);
  syncSidebarSelected();
  reset();
}

function toggleAuthor(name) {
  S.author = S.author === name ? '' : name;
  syncSidebarSelected();
  reset();
}

function clearDate() {
  S.fromDate = ''; S.toDate = '';
  document.getElementById('from-date').value = '';
  document.getElementById('to-date').value = '';
  document.getElementById('date-clear-row').style.display = 'none';
  reset();
}

function clearAll() {
  S.tags = []; S.author = ''; S.q = '';
  document.getElementById('search').value = '';
  clearDate();
  syncSidebarSelected();
  reset();
}

function expandCard(card) {
  const body   = card.querySelector('.card-body');
  const toggle = card.querySelector('.card-toggle');
  const clamped = body.classList.toggle('clamped');
  toggle.textContent = clamped ? 'Show more' : 'Show less';
}

function syncSidebarSelected() {
  document.querySelectorAll('#tags-list .sb-filter-item').forEach(el => {
    el.classList.toggle('selected', S.tags.includes(el.dataset.v));
  });
  document.querySelectorAll('#authors-list .sb-filter-item').forEach(el => {
    el.classList.toggle('selected', S.author === el.dataset.v);
  });
  renderChips();
}

// ── Date helpers ──────────────────────────────────────────────────────────
function initDatePickers() {
  document.getElementById('from-date').addEventListener('change', onDateChange);
  document.getElementById('to-date').addEventListener('change', onDateChange);
}

function onDateChange() {
  S.fromDate = document.getElementById('from-date').value;
  S.toDate   = document.getElementById('to-date').value;
  document.getElementById('date-clear-row').style.display =
    (S.fromDate || S.toDate) ? '' : 'none';
  reset();
}

// ── Utils ─────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}
</script>
